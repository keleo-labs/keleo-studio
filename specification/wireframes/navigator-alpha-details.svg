<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>

  <!-- Title -->
  <text x="450" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Alpha Element Details</text>

  <!-- Source practice attribution bar -->
  <rect x="20" y="38" width="860" height="28" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="30" y="57" font-size="10" fill="#999999">Source: </text>
  <text x="70" y="57" font-size="10" fill="#4a90d9">Scrum Essentials</text>
  <text x="155" y="57" font-size="10" fill="#999999">| Edit</text>

  <!-- Main content area -->
  <rect x="20" y="76" width="860" height="430" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>

  <!-- Column divider annotation -->
  <line x1="490" y1="82" x2="490" y2="390" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- LEFT COLUMN (55%) -->
  <text x="250" y="98" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">55%</text>

  <!-- Maps To parent tile -->
  <rect x="36" y="108" width="440" height="36" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="4"/>
  <text x="52" y="131" font-size="12" fill="#4a90d9">Maps To: Requirements</text>
  <text x="440" y="131" font-size="12" fill="#4a90d9">&#8594;</text>

  <!-- Narratives section -->
  <text x="36" y="168" font-size="12" font-weight="bold" fill="#333333">Narratives</text>
  <rect x="36" y="178" width="440" height="16" fill="#f5f5f5" rx="3"/>
  <rect x="36" y="198" width="400" height="16" fill="#f5f5f5" rx="3"/>
  <rect x="36" y="218" width="420" height="16" fill="#f5f5f5" rx="3"/>

  <!-- Common Examples -->
  <text x="36" y="256" font-size="12" font-weight="bold" fill="#333333">Common Examples</text>
  <circle cx="48" cy="272" r="3" fill="#666666"/>
  <text x="58" y="276" font-size="11" fill="#333333">User Story</text>
  <circle cx="48" cy="292" r="3" fill="#666666"/>
  <text x="58" y="296" font-size="11" fill="#333333">Feature Request</text>
  <circle cx="48" cy="312" r="3" fill="#666666"/>
  <text x="58" y="316" font-size="11" fill="#333333">Bug Report</text>

  <!-- Reference Examples -->
  <text x="36" y="346" font-size="12" font-weight="bold" fill="#333333">Reference Examples</text>
  <rect x="36" y="356" width="440" height="28" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="48" y="374" font-size="11" fill="#333333">Login Feature</text>
  <rect x="350" y="360" width="80" height="18" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="9"/>
  <text x="390" y="373" text-anchor="middle" font-size="9" fill="#666666">Identified</text>

  <!-- RIGHT COLUMN (45%) -->
  <text x="680" y="98" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">45%</text>

  <!-- Relates To -->
  <text x="504" y="118" font-size="12" font-weight="bold" fill="#333333">Relates To</text>
  <rect x="504" y="126" width="120" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="514" y="145" font-size="11" fill="#4a90d9">Software System</text>
  <rect x="632" y="126" width="90" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="642" y="145" font-size="11" fill="#4a90d9">Team</text>

  <!-- Supporting Concerns -->
  <text x="504" y="180" font-size="12" font-weight="bold" fill="#333333">Supporting Concerns</text>
  <rect x="504" y="188" width="140" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="514" y="207" font-size="11" fill="#4a90d9">Sprint Backlog</text>
  <rect x="652" y="188" width="100" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="662" y="207" font-size="11" fill="#4a90d9">Test Suite</text>

  <!-- Variants (collapsible) -->
  <text x="504" y="245" font-size="12" font-weight="bold" fill="#333333">Variants</text>
  <text x="554" y="245" font-size="10" fill="#666666">&#9660;</text>
  <rect x="504" y="254" width="356" height="28" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="514" y="273" font-size="11" fill="#333333">Epic Variant</text>
  <rect x="504" y="286" width="356" height="28" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="514" y="305" font-size="11" fill="#333333">Technical Debt Variant</text>

  <!-- Divider between columns and full-width -->
  <line x1="36" y1="400" x2="864" y2="400" stroke="#dddddd" stroke-width="1"/>

  <!-- FULL WIDTH: Alpha State Table -->
  <text x="36" y="422" font-size="12" font-weight="bold" fill="#333333">Alpha State Table</text>
  <text x="450" y="422" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">full width</text>

  <!-- Table header -->
  <rect x="36" y="432" width="828" height="30" fill="#f0f0f0" stroke="#dddddd" stroke-width="1"/>
  <line x1="202" y1="432" x2="202" y2="498" stroke="#dddddd" stroke-width="1"/>
  <line x1="368" y1="432" x2="368" y2="498" stroke="#dddddd" stroke-width="1"/>
  <line x1="534" y1="432" x2="534" y2="498" stroke="#dddddd" stroke-width="1"/>
  <line x1="700" y1="432" x2="700" y2="498" stroke="#dddddd" stroke-width="1"/>

  <text x="119" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Identified</text>
  <text x="285" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Described</text>
  <text x="451" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Prioritised</text>
  <text x="617" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Committed</text>
  <text x="783" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">Done</text>

  <!-- Table body row -->
  <rect x="36" y="462" width="828" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <rect x="54" y="468" width="130" height="24" fill="#f5f5f5" rx="3"/>
  <rect x="220" y="468" width="130" height="24" fill="#f5f5f5" rx="3"/>
  <rect x="386" y="468" width="130" height="24" fill="#f5f5f5" rx="3"/>
  <rect x="552" y="468" width="130" height="24" fill="#f5f5f5" rx="3"/>
  <rect x="718" y="468" width="130" height="24" fill="#f5f5f5" rx="3"/>

  <!-- Annotation -->
  <text x="450" y="520" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">Cells are clickable -- sets secondary selection</text>

  <!-- Column width annotations -->
  <line x1="36" y1="542" x2="484" y2="542" stroke="#999999" stroke-width="1"/>
  <line x1="36" y1="537" x2="36" y2="547" stroke="#999999" stroke-width="1"/>
  <line x1="484" y1="537" x2="484" y2="547" stroke="#999999" stroke-width="1"/>
  <text x="260" y="558" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">Left column: 55%</text>

  <line x1="498" y1="542" x2="864" y2="542" stroke="#999999" stroke-width="1"/>
  <line x1="498" y1="537" x2="498" y2="547" stroke="#999999" stroke-width="1"/>
  <line x1="864" y1="537" x2="864" y2="547" stroke="#999999" stroke-width="1"/>
  <text x="681" y="558" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">Right column: 45%</text>
</svg>