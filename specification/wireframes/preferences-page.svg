<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="#ffffff"/>

  <!-- Page title -->
  <text x="30" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#333333">Preferences</text>
  <line x1="30" y1="52" x2="470" y2="52" stroke="#dddddd" stroke-width="1"/>

  <!-- Form container -->
  <rect x="30" y="70" width="440" height="200" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>

  <!-- Theme selector -->
  <text x="50" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Theme</text>
  <rect x="50" y="112" width="200" height="30" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="62" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Dark</text>
  <text x="234" y="132" font-family="system-ui, sans-serif" font-size="10" fill="#999999">▼</text>

  <!-- Dropdown hint -->
  <rect x="50" y="142" width="200" height="40" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3" opacity="0.7"/>
  <rect x="54" y="146" width="192" height="16" fill="#e3f0ff" rx="2"/>
  <text x="62" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#4a90d9">Dark</text>
  <text x="62" y="176" font-family="system-ui, sans-serif" font-size="10" fill="#333333">Light</text>

  <!-- Language Pack selector -->
  <text x="50" y="206" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Language Pack</text>
  <rect x="50" y="216" width="200" height="30" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="62" y="236" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Default</text>
  <text x="234" y="236" font-family="system-ui, sans-serif" font-size="10" fill="#999999">▼</text>

  <!-- Live preview -->
  <rect x="270" y="216" width="180" height="30" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="282" y="228" font-family="system-ui, sans-serif" font-size="9" fill="#999999">Preview:</text>
  <text x="282" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#333333">App Title: Keleo Studio</text>

  <!-- Annotation -->
  <text x="30" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">Both settings are persisted as browser cookies.  Changes apply immediately.</text>
</svg>