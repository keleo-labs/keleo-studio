<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1080" viewBox="0 0 320 1080">
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>

  <!-- Sidebar container -->
  <rect x="10" y="10" width="280" height="1060" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <!-- Right border -->
  <line x1="290" y1="10" x2="290" y2="1070" stroke="#cccccc" stroke-width="2"/>

  <!-- Width annotation -->
  <line x1="10" y1="5" x2="290" y2="5" stroke="#999999" stroke-width="1"/>
  <line x1="10" y1="0" x2="10" y2="10" stroke="#999999" stroke-width="1"/>
  <line x1="290" y1="0" x2="290" y2="10" stroke="#999999" stroke-width="1"/>
  <text x="150" y="4" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">280px</text>

  <!-- 1. Introduction button (SELECTED STATE) -->
  <rect x="14" y="20" width="272" height="36" fill="#e3f0ff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <!-- 3px left border highlight -->
  <rect x="14" y="20" width="3" height="36" fill="#4a90d9" rx="1"/>
  <text x="28" y="43" font-size="12" font-weight="bold" fill="#333333">Scrum Essentials</text>
  <text x="258" y="43" text-anchor="end" font-size="10" fill="#999999" font-style="italic">selected</text>

  <!-- Divider -->
  <line x1="24" y1="66" x2="280" y2="66" stroke="#dddddd" stroke-width="1"/>

  <!-- 2. Patterns section (conditional - dashed border) -->
  <text x="24" y="84" font-size="10" fill="#999999" font-weight="bold">PATTERNS</text>
  <rect x="14" y="92" width="272" height="30" fill="#ffffff" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 2" rx="4"/>
  <rect x="14" y="92" width="3" height="30" fill="transparent"/>
  <text x="28" y="112" font-size="12" fill="#333333">Sprint Pattern</text>

  <rect x="14" y="126" width="272" height="30" fill="#ffffff" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 2" rx="4"/>
  <rect x="14" y="126" width="3" height="30" fill="transparent"/>
  <text x="28" y="146" font-size="12" fill="#333333">Daily Cycle Pattern</text>

  <!-- Divider -->
  <line x1="24" y1="168" x2="280" y2="168" stroke="#dddddd" stroke-width="1"/>

  <!-- 3. Mode toggle (segmented control) -->
  <rect x="24" y="180" width="252" height="34" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="17"/>
  <!-- Active segment: Concerns -->
  <rect x="26" y="182" width="124" height="30" fill="#4a90d9" stroke="#4a90d9" stroke-width="1" rx="15"/>
  <text x="88" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Concerns</text>
  <!-- Inactive segment: Activities -->
  <text x="212" y="202" text-anchor="middle" font-size="12" fill="#666666">Activities</text>

  <!-- 4. Overview button -->
  <rect x="14" y="226" width="272" height="30" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="226" width="3" height="30" fill="transparent"/>
  <text x="28" y="246" font-size="12" fill="#333333">Overview</text>

  <!-- 5. Focus groups -->

  <!-- Focus group 1: EXPANDED -->
  <rect x="14" y="268" width="272" height="28" fill="#e8e8e8" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="38" y="287" font-size="12" font-weight="bold" fill="#333333">Value</text>
  <text x="28" y="288" font-size="10" fill="#666666">&#9660;</text>

  <!-- Focus description (left-bordered aside) -->
  <rect x="30" y="300" width="3" height="30" fill="#cccccc"/>
  <rect x="37" y="300" width="245" height="30" fill="#f5f5f5" rx="3"/>
  <text x="44" y="318" font-size="10" fill="#999999" font-style="italic">Focus description text...</text>

  <!-- Root alpha (with expand arrow, indented at 42px) -->
  <rect x="14" y="336" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="336" width="3" height="28" fill="transparent"/>
  <text x="52" y="355" font-size="10" fill="#666666">&#9660;</text>
  <text x="62" y="355" font-size="12" fill="#333333">Product Backlog</text>

  <!-- Child alpha (deeper indent) -->
  <rect x="14" y="368" width="272" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="368" width="3" height="26" fill="transparent"/>
  <text x="82" y="386" font-size="11" fill="#333333">Product Backlog Item</text>

  <!-- Another child alpha -->
  <rect x="14" y="398" width="272" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="398" width="3" height="26" fill="transparent"/>
  <text x="82" y="416" font-size="11" fill="#333333">Sprint Backlog</text>

  <!-- Root alpha (no children, no arrow) -->
  <rect x="14" y="430" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="430" width="3" height="28" fill="transparent"/>
  <text x="62" y="449" font-size="12" fill="#333333">Done Increment</text>

  <!-- Focus group 2: COLLAPSED -->
  <rect x="14" y="470" width="272" height="28" fill="#e8e8e8" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="38" y="489" font-size="12" font-weight="bold" fill="#333333">Solution</text>
  <text x="28" y="490" font-size="10" fill="#666666">&#9654;</text>

  <!-- Focus group 3: COLLAPSED -->
  <rect x="14" y="502" width="272" height="28" fill="#e8e8e8" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="38" y="521" font-size="12" font-weight="bold" fill="#333333">Endeavor</text>
  <text x="28" y="522" font-size="10" fill="#666666">&#9654;</text>

  <!-- Divider -->
  <line x1="24" y1="544" x2="280" y2="544" stroke="#dddddd" stroke-width="1"/>

  <!-- 6. Work Products section -->
  <text x="24" y="562" font-size="10" fill="#999999" font-weight="bold">WORK PRODUCTS</text>

  <rect x="14" y="572" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="572" width="3" height="28" fill="transparent"/>
  <text x="28" y="591" font-size="12" fill="#333333">Product Backlog Artifact</text>

  <rect x="14" y="604" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="604" width="3" height="28" fill="transparent"/>
  <text x="28" y="623" font-size="12" fill="#333333">Sprint Backlog Artifact</text>

  <rect x="14" y="636" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="636" width="3" height="28" fill="transparent"/>
  <text x="28" y="655" font-size="12" fill="#333333">Definition of Done</text>

  <!-- Divider -->
  <line x1="24" y1="678" x2="280" y2="678" stroke="#dddddd" stroke-width="1"/>

  <!-- 7. Roles & Competencies -->
  <text x="24" y="696" font-size="10" fill="#999999" font-weight="bold">PERSONA GROUPS</text>

  <!-- Expandable persona group -->
  <rect x="14" y="706" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="706" width="3" height="28" fill="transparent"/>
  <text x="28" y="724" font-size="10" fill="#666666">&#9660;</text>
  <text x="40" y="725" font-size="12" fill="#333333">Development Team</text>

  <!-- Child persona (indented) -->
  <rect x="14" y="738" width="272" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="738" width="3" height="26" fill="transparent"/>
  <text x="62" y="756" font-size="11" fill="#333333">Developer</text>

  <rect x="14" y="768" width="272" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="768" width="3" height="26" fill="transparent"/>
  <text x="62" y="786" font-size="11" fill="#333333">Tester</text>

  <!-- Another persona group (collapsed) -->
  <rect x="14" y="800" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="800" width="3" height="28" fill="transparent"/>
  <text x="28" y="818" font-size="10" fill="#666666">&#9654;</text>
  <text x="40" y="819" font-size="12" fill="#333333">Stakeholders</text>

  <text x="24" y="852" font-size="10" fill="#999999" font-weight="bold">COMPETENCIES</text>

  <rect x="14" y="862" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="862" width="3" height="28" fill="transparent"/>
  <text x="28" y="881" font-size="12" fill="#333333">Agile Facilitation</text>

  <rect x="14" y="894" width="272" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="894" width="3" height="28" fill="transparent"/>
  <text x="28" y="913" font-size="12" fill="#333333">Technical Leadership</text>

  <!-- Divider -->
  <line x1="24" y1="936" x2="280" y2="936" stroke="#dddddd" stroke-width="1"/>

  <!-- 8. References button -->
  <rect x="14" y="948" width="272" height="30" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <rect x="14" y="948" width="3" height="30" fill="transparent"/>
  <text x="28" y="968" font-size="12" fill="#333333">References</text>

  <!-- Legend -->
  <rect x="14" y="1000" width="272" height="56" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="24" y="1018" font-size="10" font-weight="bold" fill="#999999">Legend</text>
  <rect x="24" y="1026" width="3" height="14" fill="#4a90d9"/>
  <text x="34" y="1037" font-size="10" fill="#999999">= Selected item (3px left border + tinted bg)</text>
  <rect x="24" y="1044" width="18" height="8" fill="none" stroke="#dddddd" stroke-dasharray="4 2" stroke-width="1"/>
  <text x="48" y="1051" font-size="10" fill="#999999">= Conditional section</text>
</svg>