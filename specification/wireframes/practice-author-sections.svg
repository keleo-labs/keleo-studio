<svg xmlns="http://www.w3.org/2000/svg" width="700" height="820" viewBox="0 0 700 820">
  <rect width="700" height="820" fill="#ffffff"/>

  <!-- Practice Identity section (NOT collapsible) -->
  <rect x="20" y="20" width="660" height="230" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="14" fill="#333333" font-weight="bold">Practice Identity</text>
  <text x="590" y="45" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">always open</text>

  <!-- Property table -->
  <rect x="30" y="58" width="640" height="182" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>

  <!-- Label column header area -->
  <line x1="230" y1="58" x2="230" y2="240" stroke="#dddddd" stroke-width="1"/>

  <!-- Name row -->
  <text x="45" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Name</text>
  <text x="218" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#cc0000">*</text>
  <rect x="240" y="66" width="420" height="24" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="250" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#666666">My Practice Name</text>
  <line x1="30" y1="96" x2="670" y2="96" stroke="#eeeeee" stroke-width="1"/>

  <!-- Description row -->
  <text x="45" y="117" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Description</text>
  <text x="218" y="117" font-family="system-ui, sans-serif" font-size="11" fill="#cc0000">*</text>
  <rect x="240" y="101" width="420" height="36" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="250" y="117" font-family="system-ui, sans-serif" font-size="10" fill="#999999">A practice for managing...</text>
  <text x="250" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#999999">(auto-sizing text area)</text>
  <line x1="30" y1="143" x2="670" y2="143" stroke="#eeeeee" stroke-width="1"/>

  <!-- Baseline Practice Name (conditional) -->
  <text x="45" y="163" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Baseline Practice Name</text>
  <rect x="240" y="148" width="420" height="24" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="2" stroke-dasharray="4 2"/>
  <text x="250" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">extension only</text>
  <line x1="30" y1="178" x2="670" y2="178" stroke="#eeeeee" stroke-width="1"/>

  <!-- Version -->
  <text x="45" y="198" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Version</text>
  <rect x="240" y="183" width="200" height="24" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="250" y="199" font-family="system-ui, sans-serif" font-size="11" fill="#666666">1.0.0</text>
  <line x1="30" y1="213" x2="670" y2="213" stroke="#eeeeee" stroke-width="1"/>

  <!-- Authors / Keywords -->
  <text x="45" y="233" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Authors</text>
  <rect x="240" y="218" width="420" height="18" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="2"/>

  <!-- Focuses section (EXPANDED) -->
  <rect x="20" y="268" width="660" height="220" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>

  <!-- Section header -->
  <rect x="20" y="268" width="660" height="36" fill="#e8e8e8" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="42" y="291" font-family="system-ui, sans-serif" font-size="13" fill="#333333">&#9660;</text>
  <text x="60" y="291" font-family="system-ui, sans-serif" font-size="13" fill="#333333" font-weight="bold">Focuses</text>
  <rect x="130" y="276" width="24" height="20" fill="#4a90d9" rx="10"/>
  <text x="142" y="290" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">2</text>

  <!-- Focus item 1 -->
  <rect x="30" y="314" width="640" height="50" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="50" y="335" font-family="system-ui, sans-serif" font-size="11" fill="#999999">&#8801;</text>
  <text x="70" y="335" font-family="system-ui, sans-serif" font-size="12" fill="#333333" font-weight="bold">Customer Focus</text>
  <text x="70" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Understanding and validating customer needs</text>
  <!-- Controls -->
  <rect x="546" y="322" width="20" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="556" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">&#9650;</text>
  <rect x="570" y="322" width="20" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="580" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">&#9660;</text>
  <rect x="598" y="322" width="60" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="628" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Remove</text>

  <!-- Focus item 2 -->
  <rect x="30" y="372" width="640" height="50" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="50" y="393" font-family="system-ui, sans-serif" font-size="11" fill="#999999">&#8801;</text>
  <text x="70" y="393" font-family="system-ui, sans-serif" font-size="12" fill="#333333" font-weight="bold">Solution Focus</text>
  <text x="70" y="410" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Building and delivering the solution</text>
  <rect x="546" y="380" width="20" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="556" y="394" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">&#9650;</text>
  <rect x="570" y="380" width="20" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="580" y="394" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">&#9660;</text>
  <rect x="598" y="380" width="60" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="628" y="394" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Remove</text>

  <!-- Add button -->
  <rect x="30" y="434" width="640" height="30" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3" stroke-dasharray="4 2"/>
  <text x="350" y="453" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">+ Add Focus</text>

  <!-- Alphas section (COLLAPSED) -->
  <rect x="20" y="506" width="660" height="36" fill="#e8e8e8" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="42" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#333333">&#9654;</text>
  <text x="60" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#333333" font-weight="bold">Alphas and Trajectories</text>
  <rect x="230" y="514" width="24" height="20" fill="#4a90d9" rx="10"/>
  <text x="242" y="528" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">4</text>

  <!-- Competencies section (COLLAPSED) -->
  <rect x="20" y="550" width="660" height="36" fill="#e8e8e8" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="42" y="573" font-family="system-ui, sans-serif" font-size="13" fill="#333333">&#9654;</text>
  <text x="60" y="573" font-family="system-ui, sans-serif" font-size="13" fill="#333333" font-weight="bold">Competencies</text>
  <rect x="160" y="558" width="24" height="20" fill="#4a90d9" rx="10"/>
  <text x="172" y="572" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">3</text>

  <!-- Work Products section (COLLAPSED) -->
  <rect x="20" y="594" width="660" height="36" fill="#e8e8e8" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="42" y="617" font-family="system-ui, sans-serif" font-size="13" fill="#333333">&#9654;</text>
  <text x="60" y="617" font-family="system-ui, sans-serif" font-size="13" fill="#333333" font-weight="bold">Work Products</text>
  <rect x="165" y="602" width="24" height="20" fill="#4a90d9" rx="10"/>
  <text x="177" y="616" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">5</text>

  <!-- Activity Spaces section (COLLAPSED) -->
  <rect x="20" y="638" width="660" height="36" fill="#e8e8e8" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="42" y="661" font-family="system-ui, sans-serif" font-size="13" fill="#333333">&#9654;</text>
  <text x="60" y="661" font-family="system-ui, sans-serif" font-size="13" fill="#333333" font-weight="bold">Activity Spaces</text>
  <rect x="180" y="646" width="24" height="20" fill="#4a90d9" rx="10"/>
  <text x="192" y="660" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">6</text>

  <!-- Patterns section (COLLAPSED) -->
  <rect x="20" y="682" width="660" height="36" fill="#e8e8e8" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="42" y="705" font-family="system-ui, sans-serif" font-size="13" fill="#333333">&#9654;</text>
  <text x="60" y="705" font-family="system-ui, sans-serif" font-size="13" fill="#333333" font-weight="bold">Patterns</text>
  <rect x="130" y="690" width="24" height="20" fill="#4a90d9" rx="10"/>
  <text x="142" y="704" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">2</text>

  <!-- More sections indicator -->
  <text x="350" y="745" font-family="system-ui, sans-serif" font-size="14" fill="#999999" text-anchor="middle">...</text>
  <text x="350" y="765" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic" text-anchor="middle">Personas, Persona Groups, Narrative Types, Alpha Instances, etc.</text>

  <!-- Annotation: label column width -->
  <line x1="30" y1="800" x2="230" y2="800" stroke="#999999" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="130" y="814" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic" text-anchor="middle">~200px label column</text>
  <line x1="240" y1="800" x2="670" y2="800" stroke="#999999" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="455" y="814" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic" text-anchor="middle">flexible value column</text>
</svg>