<svg xmlns="http://www.w3.org/2000/svg" width="380" height="500" viewBox="0 0 380 500">
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>

  <!-- Width annotation -->
  <line x1="20" y1="8" x2="340" y2="8" stroke="#999999" stroke-width="1"/>
  <line x1="20" y1="3" x2="20" y2="13" stroke="#999999" stroke-width="1"/>
  <line x1="340" y1="3" x2="340" y2="13" stroke="#999999" stroke-width="1"/>
  <text x="180" y="7" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">320px</text>

  <!-- Panel container -->
  <rect x="20" y="18" width="320" height="470" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>

  <!-- Close button -->
  <rect x="304" y="26" width="28" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="318" y="45" text-anchor="middle" font-size="14" fill="#666666">&#215;</text>

  <!-- Breadcrumb parent links -->
  <text x="32" y="46" font-size="10" fill="#4a90d9">Value</text>
  <text x="56" y="46" font-size="10" fill="#999999">&#8250;</text>
  <text x="66" y="46" font-size="10" fill="#4a90d9">Product Backlog</text>

  <!-- Divider -->
  <line x1="32" y1="56" x2="328" y2="56" stroke="#dddddd" stroke-width="1"/>

  <!-- Title with "Go to" arrow -->
  <text x="32" y="80" font-size="14" font-weight="bold" fill="#333333">Identified</text>
  <rect x="106" y="66" width="60" height="22" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="3"/>
  <text x="116" y="81" font-size="11" fill="#4a90d9">Go to &#8594;</text>

  <!-- Divider -->
  <line x1="32" y1="96" x2="328" y2="96" stroke="#dddddd" stroke-width="1"/>

  <!-- Content area -->
  <rect x="32" y="108" width="296" height="360" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>

  <!-- Content placeholder: Narratives -->
  <text x="44" y="132" font-size="12" font-weight="bold" fill="#333333">Description</text>
  <rect x="44" y="142" width="272" height="14" fill="#f5f5f5" rx="3"/>
  <rect x="44" y="160" width="240" height="14" fill="#f5f5f5" rx="3"/>
  <rect x="44" y="178" width="260" height="14" fill="#f5f5f5" rx="3"/>

  <!-- Content placeholder: Checklist -->
  <text x="44" y="214" font-size="12" font-weight="bold" fill="#333333">Checklist</text>
  <rect x="44" y="224" width="272" height="24" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="56" y="240" font-size="10" fill="#333333">&#9744; Stakeholders identified</text>
  <rect x="44" y="252" width="272" height="24" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="56" y="268" font-size="10" fill="#333333">&#9744; Source documented</text>
  <rect x="44" y="280" width="272" height="24" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="56" y="296" font-size="10" fill="#333333">&#9744; Priority assigned</text>

  <!-- Content placeholder: Progressed By -->
  <text x="44" y="328" font-size="12" font-weight="bold" fill="#333333">Progressed By</text>
  <rect x="44" y="338" width="160" height="24" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="54" y="354" font-size="11" fill="#4a90d9">Sprint Planning</text>
  <rect x="212" y="338" width="104" height="24" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="222" y="354" font-size="11" fill="#4a90d9">Refinement</text>

  <!-- Content placeholder: Evidenced By -->
  <text x="44" y="388" font-size="12" font-weight="bold" fill="#333333">Evidenced By</text>
  <rect x="44" y="398" width="200" height="24" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="54" y="414" font-size="11" fill="#4a90d9">Product Backlog Artifact</text>

  <!-- Tags -->
  <text x="44" y="446" font-size="12" font-weight="bold" fill="#333333">Tags</text>
  <rect x="44" y="452" width="60" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="10"/>
  <text x="74" y="466" text-anchor="middle" font-size="9" fill="#666666">planning</text>
  <rect x="112" y="452" width="55" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="10"/>
  <text x="139" y="466" text-anchor="middle" font-size="9" fill="#666666">agile</text>
</svg>