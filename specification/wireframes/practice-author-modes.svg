<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Toolbar with mode toggle -->
  <rect x="20" y="20" width="860" height="50" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="40" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#333333" font-weight="bold">Editing Mode</text>

  <!-- Mode toggle buttons -->
  <!-- WYSIWYG (active) -->
  <rect x="160" y="30" width="100" height="30" fill="#e3f0ff" stroke="#4a90d9" stroke-width="2" rx="3"/>
  <text x="210" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#4a90d9" font-weight="bold" text-anchor="middle">WYSIWYG</text>

  <!-- YAML -->
  <rect x="260" y="30" width="80" height="30" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="300" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#333333" text-anchor="middle">YAML</text>

  <!-- JSON -->
  <rect x="340" y="30" width="80" height="30" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="380" y="50" font-family="system-ui, sans-serif" font-size="12" fill="#333333" text-anchor="middle">JSON</text>

  <!-- Three preview panels side by side -->
  <!-- WYSIWYG Preview -->
  <rect x="20" y="90" width="280" height="310" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="160" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#333333" font-weight="bold" text-anchor="middle">WYSIWYG Mode</text>
  <line x1="30" y1="120" x2="290" y2="120" stroke="#dddddd" stroke-width="1"/>

  <!-- Form rows -->
  <rect x="30" y="130" width="260" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="40" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#999999">Name</text>
  <rect x="110" y="134" width="170" height="20" fill="#f5f5f5" rx="2"/>
  <text x="120" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#999999">My Practice</text>

  <rect x="30" y="164" width="260" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="40" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#999999">Description</text>
  <rect x="110" y="168" width="170" height="20" fill="#f5f5f5" rx="2"/>

  <rect x="30" y="198" width="260" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="40" y="216" font-family="system-ui, sans-serif" font-size="10" fill="#999999">Version</text>
  <rect x="110" y="202" width="170" height="20" fill="#f5f5f5" rx="2"/>

  <!-- Collapsible section header -->
  <rect x="30" y="240" width="260" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="50" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#333333" font-weight="bold">&#9660; Focuses</text>
  <rect x="254" y="244" width="28" height="20" fill="#d0d0d0" rx="10"/>
  <text x="268" y="258" font-family="system-ui, sans-serif" font-size="9" fill="#666666" text-anchor="middle">2</text>

  <!-- Collapsed section -->
  <rect x="30" y="274" width="260" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="50" y="292" font-family="system-ui, sans-serif" font-size="10" fill="#333333" font-weight="bold">&#9654; Alphas</text>
  <rect x="254" y="278" width="28" height="20" fill="#d0d0d0" rx="10"/>
  <text x="268" y="292" font-family="system-ui, sans-serif" font-size="9" fill="#666666" text-anchor="middle">4</text>

  <rect x="30" y="308" width="260" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="50" y="326" font-family="system-ui, sans-serif" font-size="10" fill="#333333" font-weight="bold">&#9654; Competencies</text>

  <text x="160" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic" text-anchor="middle">Structured form with property rows</text>
  <text x="160" y="384" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic" text-anchor="middle">and collapsible sections</text>

  <!-- YAML Preview -->
  <rect x="310" y="90" width="280" height="310" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="450" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#333333" font-weight="bold" text-anchor="middle">YAML Mode</text>
  <line x1="320" y1="120" x2="580" y2="120" stroke="#dddddd" stroke-width="1"/>

  <!-- Code editor area -->
  <rect x="320" y="128" width="260" height="220" fill="#1e1e1e" stroke="#555555" stroke-width="1" rx="2"/>

  <!-- Line numbers -->
  <rect x="320" y="128" width="30" height="220" fill="#2d2d2d" rx="2 0 0 2"/>
  <text x="340" y="146" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">1</text>
  <text x="340" y="160" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">2</text>
  <text x="340" y="174" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">3</text>
  <text x="340" y="188" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">4</text>
  <text x="340" y="202" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">5</text>
  <text x="340" y="216" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">6</text>
  <text x="340" y="230" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">7</text>

  <!-- YAML content (syntax highlighted placeholders) -->
  <text x="356" y="146" font-family="monospace" font-size="9" fill="#9cdcfe">name</text>
  <text x="382" y="146" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="390" y="146" font-family="monospace" font-size="9" fill="#ce9178">My Practice</text>
  <text x="356" y="160" font-family="monospace" font-size="9" fill="#9cdcfe">description</text>
  <text x="416" y="160" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="424" y="160" font-family="monospace" font-size="9" fill="#ce9178">|</text>
  <text x="364" y="174" font-family="monospace" font-size="9" fill="#ce9178">A practice for...</text>
  <text x="356" y="188" font-family="monospace" font-size="9" fill="#9cdcfe">version</text>
  <text x="398" y="188" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="406" y="188" font-family="monospace" font-size="9" fill="#ce9178">1.0.0</text>
  <text x="356" y="202" font-family="monospace" font-size="9" fill="#9cdcfe">alphas</text>
  <text x="392" y="202" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="364" y="216" font-family="monospace" font-size="9" fill="#d4d4d4">-</text>
  <text x="376" y="216" font-family="monospace" font-size="9" fill="#9cdcfe">name</text>
  <text x="400" y="216" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="408" y="216" font-family="monospace" font-size="9" fill="#ce9178">Requirements</text>
  <text x="376" y="230" font-family="monospace" font-size="9" fill="#9cdcfe">states</text>
  <text x="408" y="230" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>

  <!-- Apply button -->
  <rect x="320" y="356" width="100" height="26" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="370" y="373" font-family="system-ui, sans-serif" font-size="10" fill="#333333" text-anchor="middle">Apply YAML</text>

  <text x="450" y="400" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic" text-anchor="middle">Code editor with syntax highlighting</text>

  <!-- JSON Preview -->
  <rect x="600" y="90" width="280" height="310" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="740" y="112" font-family="system-ui, sans-serif" font-size="12" fill="#333333" font-weight="bold" text-anchor="middle">JSON Mode</text>
  <line x1="610" y1="120" x2="870" y2="120" stroke="#dddddd" stroke-width="1"/>

  <!-- Code editor area -->
  <rect x="610" y="128" width="260" height="220" fill="#1e1e1e" stroke="#555555" stroke-width="1" rx="2"/>

  <!-- Line numbers -->
  <rect x="610" y="128" width="30" height="220" fill="#2d2d2d" rx="2 0 0 2"/>
  <text x="630" y="146" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">1</text>
  <text x="630" y="160" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">2</text>
  <text x="630" y="174" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">3</text>
  <text x="630" y="188" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">4</text>
  <text x="630" y="202" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">5</text>
  <text x="630" y="216" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">6</text>
  <text x="630" y="230" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">7</text>
  <text x="630" y="244" font-family="monospace" font-size="9" fill="#666666" text-anchor="end">8</text>

  <!-- JSON content -->
  <text x="646" y="146" font-family="monospace" font-size="9" fill="#d4d4d4">{</text>
  <text x="654" y="160" font-family="monospace" font-size="9" fill="#9cdcfe">"name"</text>
  <text x="690" y="160" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="698" y="160" font-family="monospace" font-size="9" fill="#ce9178">"My Practice"</text>
  <text x="780" y="160" font-family="monospace" font-size="9" fill="#d4d4d4">,</text>
  <text x="654" y="174" font-family="monospace" font-size="9" fill="#9cdcfe">"description"</text>
  <text x="726" y="174" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="734" y="174" font-family="monospace" font-size="9" fill="#ce9178">"..."</text>
  <text x="758" y="174" font-family="monospace" font-size="9" fill="#d4d4d4">,</text>
  <text x="654" y="188" font-family="monospace" font-size="9" fill="#9cdcfe">"version"</text>
  <text x="714" y="188" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="722" y="188" font-family="monospace" font-size="9" fill="#ce9178">"1.0.0"</text>
  <text x="762" y="188" font-family="monospace" font-size="9" fill="#d4d4d4">,</text>
  <text x="654" y="202" font-family="monospace" font-size="9" fill="#9cdcfe">"alphas"</text>
  <text x="706" y="202" font-family="monospace" font-size="9" fill="#d4d4d4">: [</text>
  <text x="662" y="216" font-family="monospace" font-size="9" fill="#d4d4d4">{</text>
  <text x="670" y="230" font-family="monospace" font-size="9" fill="#9cdcfe">"name"</text>
  <text x="706" y="230" font-family="monospace" font-size="9" fill="#d4d4d4">:</text>
  <text x="714" y="230" font-family="monospace" font-size="9" fill="#ce9178">"Requirements"</text>
  <text x="662" y="244" font-family="monospace" font-size="9" fill="#d4d4d4">}</text>

  <!-- Apply button -->
  <rect x="610" y="356" width="100" height="26" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="660" y="373" font-family="system-ui, sans-serif" font-size="10" fill="#333333" text-anchor="middle">Apply JSON</text>

  <text x="740" y="400" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic" text-anchor="middle">Code editor with syntax highlighting</text>
</svg>