  <circle cx="24" cy="440" r="6.5" fill="#ffffff" stroke="#8476d1" stroke-width="1"/>
  <text x="24" y="443" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#999999" text-anchor="middle">5</text>
  <text x="38" y="444" font-family="system-ui, sans-serif" font-size="9" fill="#999999">Transition &#8594; Elaboration: Given the release objective is not met, When the increment review completes, Then&#8230;</text>

  <!-- Annotation -->
  <text x="16" y="486" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">Column headers select the pattern view; row labels select the concern; state cells select alphaName::stateName. Elaboration / Feature Set shown as selected.</text>
  <text x="16" y="498" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">A muted cell is a state carried over unchanged from the previous phase; it is still named and still clickable. &#183; marks a phase that declares nothing for that concern.</text>
  <text x="16" y="510" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">The loop channel, its guard and the narrative strips appear only when the pattern declares them.</text>
</svg>
