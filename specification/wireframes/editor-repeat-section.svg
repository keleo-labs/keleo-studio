<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <rect width="800" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#333333">RepeatSection — Ordered Array Editor</text>

  <!-- Section container -->
  <rect x="20" y="50" width="760" height="370" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>

  <!-- Section header -->
  <rect x="24" y="54" width="752" height="32" fill="#f0f0f0" rx="4"/>
  <text x="42" y="74" font-family="system-ui, sans-serif" font-size="12" fill="#333333">▼</text>
  <text x="60" y="74" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#333333">States</text>
  <!-- Count badge -->
  <rect x="112" y="62" width="24" height="18" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="9"/>
  <text x="124" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#4a90d9" text-anchor="middle">3</text>

  <!-- Item 1: Collapsed -->
  <rect x="32" y="94" width="740" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="48" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#999999">1.</text>
  <text x="68" y="116" font-family="system-ui, sans-serif" font-size="12" fill="#333333">▶ Conceived</text>
  <!-- Action buttons -->
  <rect x="620" y="100" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="632" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">↑</text>
  <rect x="650" y="100" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="662" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">↓</text>
  <rect x="680" y="100" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="692" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">×</text>
  <text x="720" y="115" font-family="system-ui, sans-serif" font-size="9" fill="#999999" font-style="italic">collapsed</text>

  <!-- Item 2: Expanded -->
  <rect x="32" y="138" width="740" height="150" fill="#ffffff" stroke="#4a90d9" stroke-width="2" rx="4"/>
  <text x="48" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#999999">2.</text>
  <text x="68" y="162" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">▼ Bounded</text>
  <!-- Action buttons -->
  <rect x="620" y="146" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="632" y="161" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">↑</text>
  <rect x="650" y="146" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="662" y="161" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">↓</text>
  <rect x="680" y="146" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="692" y="161" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">×</text>
  <text x="720" y="161" font-family="system-ui, sans-serif" font-size="9" fill="#4a90d9" font-style="italic">expanded</text>

  <!-- Expanded detail area -->
  <line x1="48" y1="172" x2="756" y2="172" stroke="#dddddd" stroke-width="1"/>

  <!-- Detail fields -->
  <text x="56" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Name</text>
  <rect x="160" y="180" width="400" height="22" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="168" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Bounded</text>

  <text x="56" y="222" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Description</text>
  <rect x="160" y="208" width="400" height="22" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="168" y="223" font-family="system-ui, sans-serif" font-size="11" fill="#999999">State description...</text>

  <text x="56" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Checklists</text>
  <rect x="160" y="236" width="400" height="40" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="168" y="252" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Checklist items nested here...</text>
  <text x="168" y="268" font-family="system-ui, sans-serif" font-size="10" fill="#666666">(nested RepeatSection)</text>

  <!-- Item 3: Collapsed -->
  <rect x="32" y="296" width="740" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="48" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#999999">3.</text>
  <text x="68" y="318" font-family="system-ui, sans-serif" font-size="12" fill="#333333">▶ Coherent</text>
  <!-- Action buttons -->
  <rect x="620" y="302" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="632" y="317" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">↑</text>
  <rect x="650" y="302" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="662" y="317" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">↓</text>
  <rect x="680" y="302" width="24" height="22" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="692" y="317" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="middle">×</text>
  <text x="720" y="317" font-family="system-ui, sans-serif" font-size="9" fill="#999999" font-style="italic">collapsed</text>

  <!-- Add button -->
  <rect x="32" y="340" width="100" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="82" y="358" font-family="system-ui, sans-serif" font-size="11" fill="#333333" text-anchor="middle">+ Add State</text>

  <!-- Annotations -->
  <text x="32" y="386" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">Sequence numbers (1, 2, 3) auto-renumber after reorder.</text>
  <text x="32" y="400" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">Remove requires confirmation dialog.</text>
  <text x="32" y="414" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">New items appended with default values.</text>
</svg>