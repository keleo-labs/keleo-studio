<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 900 920">
  <rect width="900" height="920" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#333333">Project Manager — WYSIWYG Editor (Details Tab)</text>

  <!-- Tab bar -->
  <rect x="20" y="50" width="860" height="36" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <!-- Active tab: Details -->
  <rect x="22" y="52" width="100" height="32" fill="#ffffff" rx="3"/>
  <line x1="22" y1="82" x2="122" y2="82" stroke="#4a90d9" stroke-width="3"/>
  <text x="72" y="72" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#4a90d9" text-anchor="middle">Details</text>
  <!-- Inactive tabs -->
  <text x="172" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Plan</text>
  <text x="242" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Current</text>
  <text x="312" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#666666" text-anchor="middle">Target</text>

  <!-- Details tab content area -->
  <rect x="20" y="90" width="860" height="810" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>

  <!-- Section: Project Identity -->
  <text x="40" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#333333">Project Identity</text>
  <line x1="40" y1="128" x2="860" y2="128" stroke="#dddddd" stroke-width="1"/>

  <!-- Name field -->
  <text x="40" y="152" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Name *</text>
  <rect x="240" y="138" width="620" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="248" y="154" font-family="system-ui, sans-serif" font-size="11" fill="#999999">Project name</text>

  <!-- Description field -->
  <text x="40" y="182" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Description</text>
  <rect x="240" y="168" width="620" height="44" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="248" y="184" font-family="system-ui, sans-serif" font-size="11" fill="#999999">Project description</text>

  <!-- Section: Practice / Method Reference -->
  <text x="40" y="240" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#333333">Practice / Method Reference</text>
  <line x1="40" y1="248" x2="860" y2="248" stroke="#dddddd" stroke-width="1"/>

  <!-- Radio toggle -->
  <circle cx="55" cy="270" r="7" fill="#ffffff" stroke="#4a90d9" stroke-width="2"/>
  <circle cx="55" cy="270" r="3.5" fill="#4a90d9"/>
  <text x="70" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Practice</text>
  <circle cx="155" cy="270" r="7" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="170" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#666666">Method</text>

  <!-- Dropdown selector -->
  <rect x="240" y="258" width="400" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="248" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#999999">Select practice from library...</text>
  <text x="624" y="274" font-family="system-ui, sans-serif" font-size="10" fill="#999999">▼</text>

  <!-- Section: Metadata -->
  <text x="40" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#333333">Metadata</text>
  <line x1="40" y1="318" x2="860" y2="318" stroke="#dddddd" stroke-width="1"/>

  <!-- Metadata fields in two columns -->
  <text x="40" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Version</text>
  <rect x="240" y="328" width="200" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="248" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#999999">1.0.0</text>

  <text x="470" y="342" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Authors</text>
  <rect x="560" y="328" width="300" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="568" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#999999">One per line</text>

  <text x="40" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Keywords</text>
  <rect x="240" y="358" width="200" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="248" y="374" font-family="system-ui, sans-serif" font-size="11" fill="#999999">One per line</text>

  <text x="470" y="372" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Dates</text>
  <rect x="560" y="358" width="140" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="568" y="374" font-family="system-ui, sans-serif" font-size="11" fill="#999999">Created / Updated</text>

  <!-- Section: Team -->
  <text x="40" y="414" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#333333">Team</text>
  <line x1="40" y1="422" x2="860" y2="422" stroke="#dddddd" stroke-width="1"/>

  <!-- Team Name -->
  <text x="40" y="446" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Team Name *</text>
  <rect x="240" y="432" width="400" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="248" y="448" font-family="system-ui, sans-serif" font-size="11" fill="#999999">Team name</text>

  <!-- Team Description -->
  <text x="40" y="476" font-family="system-ui, sans-serif" font-size="12" fill="#333333">Description *</text>
  <rect x="240" y="462" width="620" height="34" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="248" y="482" font-family="system-ui, sans-serif" font-size="11" fill="#999999">Team description</text>

  <!-- Communication Channels -->
  <text x="40" y="518" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#555555">Communication Channels</text>
  <rect x="40" y="526" width="820" height="60" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <!-- Channel table header -->
  <text x="60" y="544" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#666666">Name</text>
  <text x="280" y="544" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#666666">Address</text>
  <line x1="50" y1="550" x2="850" y2="550" stroke="#dddddd" stroke-width="1"/>
  <text x="60" y="566" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Slack</text>
  <text x="280" y="566" font-family="system-ui, sans-serif" font-size="11" fill="#333333">#project-channel</text>
  <text x="800" y="566" font-family="system-ui, sans-serif" font-size="10" fill="#999999">×</text>

  <!-- Team Members -->
  <text x="40" y="610" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#555555">Members</text>

  <!-- Member table header -->
  <rect x="40" y="618" width="820" height="24" fill="#f0f0f0" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="60" y="634" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#666666">Name</text>
  <text x="240" y="634" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#666666">Persona</text>
  <text x="440" y="634" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#666666">Contact</text>
  <text x="640" y="634" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#666666">Actions</text>

  <!-- Member 1 -->
  <rect x="40" y="644" width="820" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="60" y="662" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Alice Smith</text>
  <rect x="240" y="650" width="170" height="18" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="248" y="663" font-family="system-ui, sans-serif" font-size="10" fill="#333333">Product Owner ▼</text>
  <text x="440" y="662" font-family="system-ui, sans-serif" font-size="11" fill="#333333">alice@example.com</text>
  <text x="660" y="662" font-family="system-ui, sans-serif" font-size="10" fill="#999999">↑  ↓  ×</text>

  <!-- Member 2 -->
  <rect x="40" y="672" width="820" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="60" y="690" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Bob Jones</text>
  <rect x="240" y="678" width="170" height="18" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="248" y="691" font-family="system-ui, sans-serif" font-size="10" fill="#333333">Developer ▼</text>
  <text x="440" y="690" font-family="system-ui, sans-serif" font-size="11" fill="#333333">bob@example.com</text>
  <text x="660" y="690" font-family="system-ui, sans-serif" font-size="10" fill="#999999">↑  ↓  ×</text>

  <!-- Member 3 -->
  <rect x="40" y="700" width="820" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <text x="60" y="718" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Carol Lee</text>
  <rect x="240" y="706" width="170" height="18" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="2"/>
  <text x="248" y="719" font-family="system-ui, sans-serif" font-size="10" fill="#333333">Scrum Master ▼</text>
  <text x="440" y="718" font-family="system-ui, sans-serif" font-size="11" fill="#333333">carol@example.com</text>
  <text x="660" y="718" font-family="system-ui, sans-serif" font-size="10" fill="#999999">↑  ↓  ×</text>

  <!-- Add Member button -->
  <rect x="40" y="734" width="100" height="24" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="90" y="750" font-family="system-ui, sans-serif" font-size="11" fill="#333333" text-anchor="middle">+ Add Member</text>

  <!-- Section: Notes -->
  <text x="40" y="784" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#333333">Notes</text>
  <line x1="40" y1="792" x2="860" y2="792" stroke="#dddddd" stroke-width="1"/>
  <rect x="40" y="800" width="820" height="60" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="50" y="820" font-family="system-ui, sans-serif" font-size="11" fill="#999999">Timestamped free-text annotations...</text>
  <rect x="40" y="866" width="100" height="24" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="90" y="882" font-family="system-ui, sans-serif" font-size="11" fill="#333333" text-anchor="middle">+ Add Note</text>

  <!-- Annotation: label column width -->
  <text x="240" y="910" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">← 200px label column →</text>
</svg>