<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740">
  <rect width="900" height="740" fill="#ffffff"/>

  <!-- Title -->
  <text x="16" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#333333">Work Product Element Details</text>
  <text x="16" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">Centre panel content for a selected work product element.</text>

  <!-- Panel container -->
  <rect x="16" y="56" width="868" height="670" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>

  <!-- Header: element name + source attribution -->
  <rect x="24" y="64" width="852" height="40" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="36" y="89" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#333333">Product Backlog</text>
  <text x="200" y="89" font-family="system-ui, sans-serif" font-size="10" fill="#999999">from Scrum Practice</text>
  <text x="320" y="89" font-family="system-ui, sans-serif" font-size="10" fill="#4a90d9" text-decoration="underline">Edit</text>

  <!-- Section: Narratives -->
  <text x="24" y="126" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Narratives</text>
  <rect x="24" y="132" width="852" height="48" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="36" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#666666">The product backlog is an ordered list of everything that is known to be needed in the product.</text>
  <text x="36" y="166" font-family="system-ui, sans-serif" font-size="10" fill="#666666">It is the single source of requirements for any changes to be made to the product.</text>

  <!-- Section: Part Of -->
  <text x="24" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Part Of</text>
  <rect x="24" y="208" width="180" height="32" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="4"/>
  <text x="36" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#4a90d9">Project Documentation</text>
  <text x="178" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#4a90d9">&gt;</text>

  <!-- Section: Maps To -->
  <text x="230" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Maps To</text>
  <rect x="230" y="208" width="160" height="32" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="4"/>
  <text x="242" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#4a90d9">Requirements List</text>
  <text x="364" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#4a90d9">&gt;</text>

  <!-- Section: Common Examples -->
  <text x="24" y="268" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Common Examples</text>
  <rect x="24" y="274" width="852" height="52" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <circle cx="40" cy="292" r="3" fill="#666666"/>
  <text x="50" y="296" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Jira backlog board with user stories and epics</text>
  <circle cx="40" cy="308" r="3" fill="#666666"/>
  <text x="50" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Azure DevOps product backlog with work items</text>

  <!-- Section: Reference Examples -->
  <text x="24" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Reference Examples</text>
  <rect x="24" y="354" width="852" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="36" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Requirements : Bounded</text>
  <text x="170" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#999999">-- "Evidence of stakeholder needs captured as backlog items..."</text>

  <!-- Section: Includes (child work products) -->
  <text x="24" y="414" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Includes</text>

  <!-- Child WP card 1 -->
  <rect x="24" y="422" width="200" height="56" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="36" y="444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4a90d9">User Story</text>
  <text x="36" y="460" font-family="system-ui, sans-serif" font-size="9" fill="#999999">Child work product</text>
  <text x="200" y="444" font-family="system-ui, sans-serif" font-size="11" fill="#4a90d9">&gt;</text>

  <!-- Child WP card 2 -->
  <rect x="236" y="422" width="200" height="56" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="248" y="444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4a90d9">Epic</text>
  <text x="248" y="460" font-family="system-ui, sans-serif" font-size="9" fill="#999999">Child work product</text>
  <text x="412" y="444" font-family="system-ui, sans-serif" font-size="11" fill="#4a90d9">&gt;</text>

  <!-- Child WP card 3 -->
  <rect x="448" y="422" width="200" height="56" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="460" y="444" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4a90d9">Technical Debt Item</text>
  <text x="460" y="460" font-family="system-ui, sans-serif" font-size="9" fill="#999999">Child work product</text>
  <text x="624" y="444" font-family="system-ui, sans-serif" font-size="11" fill="#4a90d9">&gt;</text>

  <!-- Section: Variants (collapsible) -->
  <rect x="24" y="494" width="852" height="32" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="44" y="515" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Variants</text>
  <text x="28" y="515" font-family="system-ui, sans-serif" font-size="12" fill="#999999">+</text>
  <text x="102" y="515" font-family="system-ui, sans-serif" font-size="10" fill="#999999">(collapsible)</text>

  <!-- Section: Download Template -->
  <rect x="24" y="540" width="180" height="34" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="40" y="562" font-family="system-ui, sans-serif" font-size="11" fill="#333333">Download Template</text>
  <text x="174" y="560" font-family="system-ui, sans-serif" font-size="10" fill="#999999">&#8681;</text>

  <!-- Section: Work Product LOD Table (abbreviated) -->
  <text x="24" y="600" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#333333">Levels of Detail</text>

  <!-- Mini LOD table -->
  <rect x="24" y="608" width="852" height="106" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>

  <!-- LOD column headers -->
  <rect x="30" y="612" width="208" height="24" fill="#f0f0f0"/>
  <text x="134" y="629" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">LOD 1</text>

  <rect x="244" y="612" width="208" height="24" fill="#f0f0f0"/>
  <text x="348" y="629" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">LOD 2</text>

  <rect x="458" y="612" width="208" height="24" fill="#f0f0f0"/>
  <text x="562" y="629" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">LOD 3</text>

  <rect x="672" y="612" width="198" height="24" fill="#f0f0f0"/>
  <text x="771" y="629" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#333333" text-anchor="middle">LOD 4</text>

  <line x1="30" y1="637" x2="870" y2="637" stroke="#cccccc" stroke-width="1"/>

  <!-- LOD tiles row -->
  <rect x="36" y="643" width="196" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <circle cx="54" cy="657" r="10" fill="#c5ddf5"/>
  <text x="54" y="661" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#333333" text-anchor="middle">1</text>
  <text x="70" y="661" font-family="system-ui, sans-serif" font-size="9" fill="#333333">Identified</text>

  <rect x="250" y="643" width="196" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <circle cx="268" cy="657" r="10" fill="#9dc4ed"/>
  <text x="268" y="661" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#333333" text-anchor="middle">2</text>
  <text x="284" y="661" font-family="system-ui, sans-serif" font-size="9" fill="#333333">Outlined</text>

  <rect x="464" y="643" width="196" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <circle cx="482" cy="657" r="10" fill="#6fa8e0"/>
  <text x="482" y="661" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="498" y="661" font-family="system-ui, sans-serif" font-size="9" fill="#333333">Detailed</text>

  <rect x="678" y="643" width="186" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <circle cx="696" cy="657" r="10" fill="#4a90d9"/>
  <text x="696" y="661" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="712" y="661" font-family="system-ui, sans-serif" font-size="9" fill="#333333">Complete</text>

  <!-- Abbreviated indicator -->
  <text x="36" y="694" font-family="system-ui, sans-serif" font-size="9" fill="#999999" font-style="italic">Description, prerequisites, contributes-to, activities, and checklists rows below...</text>

  <!-- Annotation -->
  <text x="16" y="730" font-family="system-ui, sans-serif" font-size="10" fill="#999999" font-style="italic">Centre panel layout for a Work Product. LOD table is rendered full-width at the bottom (see navigator-wp-lod-table.svg for full detail).</text>
</svg>