<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820">
  <style>
    text { font-family: system-ui, sans-serif; }
  </style>

  <!-- ===== ACTIVITY SPACE (top half) ===== -->
  <text x="450" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Activity Space Details</text>

  <rect x="20" y="38" width="860" height="340" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>

  <!-- Background Prerequisites -->
  <text x="36" y="64" font-size="12" font-weight="bold" fill="#333333">Background Prerequisites</text>
  <rect x="36" y="74" width="828" height="40" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="48" y="92" font-size="11" fill="#333333">The team must have an established backlog before entering this space.</text>
  <text x="48" y="108" font-size="11" fill="#4a90d9">Product Backlog</text>
  <text x="150" y="108" font-size="11" fill="#333333">must be in state</text>
  <text x="262" y="108" font-size="11" fill="#4a90d9">Ordered</text>

  <!-- Required Competencies -->
  <text x="36" y="138" font-size="12" font-weight="bold" fill="#333333">Required Competencies</text>
  <rect x="36" y="148" width="130" height="26" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="13"/>
  <text x="101" y="165" text-anchor="middle" font-size="11" fill="#333333">Facilitation</text>
  <rect x="174" y="148" width="155" height="26" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="13"/>
  <text x="251" y="165" text-anchor="middle" font-size="11" fill="#333333">Technical Design</text>

  <!-- Involves -->
  <text x="36" y="200" font-size="12" font-weight="bold" fill="#333333">Involves</text>
  <rect x="36" y="210" width="140" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="46" y="229" font-size="11" fill="#4a90d9">Development Team</text>
  <rect x="184" y="210" width="120" height="28" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="3"/>
  <text x="194" y="229" font-size="11" fill="#4a90d9">Product Owner</text>

  <!-- Activities list -->
  <text x="36" y="264" font-size="12" font-weight="bold" fill="#333333">Activities</text>

  <rect x="36" y="274" width="400" height="40" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="52" y="298" font-size="12" fill="#4a90d9">Sprint Planning</text>
  <text x="390" y="298" text-anchor="end" font-size="12" fill="#4a90d9">&#8594;</text>

  <rect x="36" y="318" width="400" height="40" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
  <text x="52" y="342" font-size="12" fill="#4a90d9">Backlog Refinement</text>
  <text x="390" y="342" text-anchor="end" font-size="12" fill="#4a90d9">&#8594;</text>

  <!-- Divider between Activity Space and Activity -->
  <line x1="20" y1="398" x2="880" y2="398" stroke="#cccccc" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- ===== ACTIVITY (bottom half) ===== -->
  <text x="450" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Activity Details</text>

  <rect x="20" y="444" width="860" height="360" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>

  <!-- Narratives -->
  <text x="36" y="470" font-size="12" font-weight="bold" fill="#333333">Narratives</text>
  <rect x="36" y="480" width="828" height="16" fill="#f5f5f5" rx="3"/>
  <rect x="36" y="500" width="700" height="16" fill="#f5f5f5" rx="3"/>

  <!-- Background Prerequisites -->
  <text x="36" y="540" font-size="12" font-weight="bold" fill="#333333">Background Prerequisites</text>
  <rect x="36" y="550" width="828" height="28" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="48" y="569" font-size="11" fill="#333333">Prerequisites text with cross-references...</text>

  <!-- Contributes To -->
  <text x="36" y="604" font-size="12" font-weight="bold" fill="#333333">Contributes To</text>
  <rect x="36" y="614" width="200" height="32" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="4"/>
  <text x="46" y="635" font-size="11" fill="#4a90d9">Product Backlog &#8594; Ordered</text>
  <rect x="244" y="614" width="220" height="32" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="4"/>
  <text x="254" y="635" font-size="11" fill="#4a90d9">Sprint Backlog &#8594; Committed</text>

  <!-- Works On -->
  <text x="36" y="672" font-size="12" font-weight="bold" fill="#333333">Works On</text>
  <rect x="36" y="682" width="260" height="32" fill="#e3f0ff" stroke="#4a90d9" stroke-width="1" rx="4"/>
  <text x="46" y="703" font-size="11" fill="#4a90d9">Sprint Backlog Artifact &#8594; Populated</text>

  <!-- Involves (persona badges) -->
  <text x="504" y="604" font-size="12" font-weight="bold" fill="#333333">Involves</text>
  <rect x="504" y="614" width="130" height="26" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="13"/>
  <text x="569" y="631" text-anchor="middle" font-size="11" fill="#333333">Scrum Master</text>
  <rect x="642" y="614" width="130" height="26" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="13"/>
  <text x="707" y="631" text-anchor="middle" font-size="11" fill="#333333">Dev Team</text>

  <!-- Competency requirements -->
  <text x="504" y="672" font-size="12" font-weight="bold" fill="#333333">Competency Requirements</text>
  <rect x="504" y="682" width="220" height="28" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="514" y="701" font-size="11" fill="#333333">Facilitation &#8594; Practitioner</text>
  <rect x="504" y="714" width="240" height="28" fill="#f5f5f5" stroke="#dddddd" stroke-width="1" rx="3"/>
  <text x="514" y="733" font-size="11" fill="#333333">Technical Design &#8594; Advanced</text>

  <!-- Annotations -->
  <text x="450" y="790" text-anchor="middle" font-size="10" fill="#999999" font-style="italic">Tiles and badges are clickable -- toggle secondary panel</text>
</svg>