<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect width="700" height="400" fill="#ffffff"/>

  <!-- Schema Validation Issues panel -->
  <rect x="20" y="20" width="660" height="230" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" rx="4"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="14" fill="#333333" font-weight="bold">Validation Issues</text>
  <text x="180" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#cc3333">(5 errors)</text>

  <!-- Issue list -->
  <!-- Issue 1 -->
  <rect x="30" y="58" width="640" height="32" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <circle cx="48" cy="74" r="8" fill="#cc3333"/>
  <text x="48" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">!</text>
  <text x="65" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#4a90d9" font-weight="bold">alphas[0].states[2]</text>
  <text x="65" y="84" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Missing required property: "name"</text>

  <!-- Issue 2 -->
  <rect x="30" y="96" width="640" height="32" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <circle cx="48" cy="112" r="8" fill="#cc3333"/>
  <text x="48" y="116" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">!</text>
  <text x="65" y="108" font-family="system-ui, sans-serif" font-size="10" fill="#4a90d9" font-weight="bold">alphas[1].description</text>
  <text x="65" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Expected type "string", received "number"</text>

  <!-- Issue 3 -->
  <rect x="30" y="134" width="640" height="32" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <circle cx="48" cy="150" r="8" fill="#e6a23c"/>
  <text x="48" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">&#9888;</text>
  <text x="65" y="146" font-family="system-ui, sans-serif" font-size="10" fill="#4a90d9" font-weight="bold">workProducts[0].levelsOfDetail</text>
  <text x="65" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Array has fewer than 1 items</text>

  <!-- Issue 4 -->
  <rect x="30" y="172" width="640" height="32" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <circle cx="48" cy="188" r="8" fill="#cc3333"/>
  <text x="48" y="192" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">!</text>
  <text x="65" y="184" font-family="system-ui, sans-serif" font-size="10" fill="#4a90d9" font-weight="bold">competencies[2].levels[0]</text>
  <text x="65" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Unevaluated property: "unknownField"</text>

  <!-- Overflow indicator -->
  <text x="350" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#999999" font-style="italic" text-anchor="middle">...and 12 more</text>

  <!-- Scrollbar hint -->
  <rect x="672" y="58" width="6" height="170" fill="#eeeeee" rx="3"/>
  <rect x="672" y="58" width="6" height="60" fill="#cccccc" rx="3"/>

  <!-- Reference Issues panel -->
  <rect x="20" y="270" width="660" height="115" fill="#fff8e6" stroke="#e6a23c" stroke-width="1" rx="4"/>
  <text x="40" y="295" font-family="system-ui, sans-serif" font-size="14" fill="#333333" font-weight="bold">Reference Issues</text>
  <text x="195" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#e6a23c">(warnings)</text>

  <!-- Reference issue 1 -->
  <rect x="30" y="308" width="640" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <circle cx="48" cy="322" r="8" fill="#e6a23c"/>
  <text x="48" y="326" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">&#9888;</text>
  <text x="65" y="326" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Activity "Plan Sprint" references unknown alpha "Sprint Backlog"</text>

  <!-- Reference issue 2 -->
  <rect x="30" y="342" width="640" height="28" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
  <circle cx="48" cy="356" r="8" fill="#e6a23c"/>
  <text x="48" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">&#9888;</text>
  <text x="65" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#666666">Pattern view "Iteration 1" references undefined state "Explored" on alpha "Opportunity"</text>
</svg>