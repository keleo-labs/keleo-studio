  <!-- Read-only field values -->
  <rect x="40" y="276" width="620" height="26" fill="#fafafa" stroke="#dddddd" stroke-width="1" rx="2" stroke-dasharray="4 2"/>
  <text x="55" y="289" font-family="system-ui, sans-serif" font-size="10" fill="#999999">Description</text>
  <text x="140" y="289" font-family="system-ui, sans-serif" font-size="10" fill="#888888" font-style="italic">A work product representing a user story...</text>

