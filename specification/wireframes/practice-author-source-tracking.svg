  <text x="110" y="488" font-family="system-ui, sans-serif" font-size="10" fill="#333333">Solution &#9660;</text>

  <!-- Edit controls -->
  <rect x="476" y="418" width="20" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="486" y="432" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">&#9650;</text>
  <rect x="500" y="418" width="20" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="510" y="432" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">&#9660;</text>
  <rect x="528" y="418" width="50" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="553" y="432" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Edit</text>
  <rect x="584" y="418" width="60" height="20" fill="#e8e8e8" stroke="#bbbbbb" stroke-width="1" rx="2"/>
  <text x="614" y="432" font-family="system-ui, sans-serif" font-size="10" fill="#666666" text-anchor="middle">Remove</text>

  <!-- Annotation -->
