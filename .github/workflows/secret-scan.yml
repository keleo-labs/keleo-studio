# Server-side backstop for the local pre-commit hooks.
#
# The difference that matters: these jobs scan FULL HISTORY, not the staged
# diff. That is what catches a secret committed before the hooks existed, or
# pushed by someone who bypassed them.
#
# fetch-depth: 0 is required. The default shallow clone gives the scanners one
# commit to look at, which quietly reduces this to the same scope as the hook.

name: secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Keep in step with the gitleaks rev in .pre-commit-config.yaml, so a commit
  # that passes the hook cannot fail here on a rule set the hook never had.
  GITLEAKS_VERSION: 8.30.1

jobs:
  # The gitleaks *action* is not used: it demands a paid licence key on any
  # repository owned by an organisation. The scanner itself is MIT-licensed, so
  # the pinned release binary is run directly, with its checksum verified.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Unpacked into RUNNER_TEMP, not the checkout, so the binary and its
      # tarball never sit in the tree being scanned.
      - name: install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: gitleaks
        run: "${{ runner.temp }}/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose"

  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned, not @main: the action supplies --fail and --no-update itself,
      # and passing either again is a fatal "flag cannot be repeated" error.
      # Tracking main means that contract can change under a green workflow.
      - name: trufflehog (verified only)
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --only-verified
