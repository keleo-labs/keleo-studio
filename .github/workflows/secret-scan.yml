# Secret scan. The jobs live in keleo-labs/.github so that a fix to a scanner
# quirk is one commit rather than one per repository; see that file for what
# each layer catches and why it is configured the way it is.
#
# The weekly cron is not redundant with push. gitleaks-action scans only the
# pushed commit range on push and pull_request events; full history is scanned
# only on schedule and workflow_dispatch. The cron is what catches a secret
# committed before the hooks existed, or one that a rule added later would now
# match.

name: secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays, 04:17 UTC. Off the hour, because the top of the hour is when
    # every other scheduled workflow on GitHub queues at once.
    - cron: "17 4 * * 1"

jobs:
  scan:
    uses: keleo-labs/.github/.github/workflows/secret-scan-reusable.yml@main
    permissions:
      contents: read
      # gitleaks-action comments the finding on the pull request.
      pull-requests: write
    # Passes the GITLEAKS_LICENSE organisation secret through. The Action
    # wrapper refuses to run on an organisation-owned repository without it.
    secrets: inherit
